summary: "A dark-mode platform site for HiTerra's field-to-harvest agritech product, explaining four connected modules at a glance."
intro: "HiTerra turns soil samples and field data into decisions a farm team can actually act on, across Malaysia and Indonesia. The challenge wasn't proving the tech worked — it was explaining four connected products to three completely different audiences without burying anyone in jargon. We built a dark, data-forward site that splits the homepage into explicit paths for farmers, estates, and partners, with live dashboard mockups doing the convincing instead of another feature list."
challenge: "Explain four connected products to three different audiences — farmers, estates, partners — without burying anyone in jargon."
solution: "We split the homepage into three explicit paths, each with its own CTA, and used live dashboard mockups instead of another feature list."
