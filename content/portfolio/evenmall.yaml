summary: "A bold, orange-and-black storefront for EvenMall's furniture and home-essentials marketplace."
intro: "EvenMall sells everything from Italian sofas to fitness gear under one roof, and needed a storefront confident enough to hold that range together. Rather than default to the white background and blue links most furniture marketplaces settle for, we built a bold black-and-orange identity carried through every banner, badge, and call to action — closer to a fashion outlet's energy than a generic catalogue."
challenge: "Hold furniture, home goods, pet, and fitness categories together under one storefront without it reading like a generic marketplace theme."
solution: "We built a bold black-and-orange identity and carried it through every banner, badge, and call to action, instead of the default white-background template."
stack:
  - label: "Platform"
    value: "Next.js (App Router) + Medusa.js v2"
  - label: "Payments"
    value: "Xendit — split payments & seller payouts"
  - label: "Admin"
    value: "Medusa admin — products, categories, and the homepage all edit live, no redeploy"
  - label: "Notable"
    value: "pnpm/Turborepo monorepo; localized for Malaysia (RM, SST, FPX, e-wallets, BNPL, COD); dynamic sitemap + OpenGraph"
